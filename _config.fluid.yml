# Fluid is used as the content and navigation system; the visual language is
# intentionally aligned with the monochrome YANFD studio site.
favicon: /img/favicon.png
apple_touch_icon: /img/favicon.png

dark_mode:
  enable: true
  default: light

color:
  body_bg_color: "#f2f2f4"
  body_bg_color_dark: "#1e1e1e"
  navbar_bg_color: "#f2f2f4"
  navbar_bg_color_dark: "#1e1e1e"
  navbar_text_color: "#2d2f2f"
  navbar_text_color_dark: "#f2f2f4"
  subtitle_color: "#2d2f2f"
  subtitle_color_dark: "#f2f2f4"
  text_color: "#2d2f2f"
  text_color_dark: "#f2f2f4"
  sec_text_color: "#737d7d"
  sec_text_color_dark: "#aaaaaa"
  board_color: "#ffffff"
  board_color_dark: "#252525"
  post_text_color: "#2d2f2f"
  post_text_color_dark: "#f2f2f4"
  post_heading_color: "#2d2f2f"
  post_heading_color_dark: "#f2f2f4"
  post_link_color: "#494d4d"
  post_link_color_dark: "#e2e2e7"
  link_hover_color: "#2d2f2f"
  link_hover_color_dark: "#ffffff"
  link_hover_bg_color: "#e2e2e7"
  link_hover_bg_color_dark: "#494d4d"
  line_color: "#e2e2e7"
  line_color_dark: "#494d4d"

font:
  font_size: 16px
  font_family: "Arial, Helvetica, sans-serif"
  letter_spacing: 0
  code_font_size: 85%

custom_css:
  - /css/yanfd-fluid.css

navbar:
  blog_title: "YANFD"
  ground_glass:
    enable: false
  menu:
    - { key: "home", link: "/", name: "HOME" }
    - { key: "archive", link: "/archives/", name: "ARCHIVE" }
    - { key: "tag", link: "/tags/", name: "TAGS" }
    - { key: "about", link: "/about/", name: "ABOUT" }

banner:
  parallax: false

index:
  banner_img: ""
  banner_img_height: 72
  banner_mask_alpha: 0
  default_index_img: /img/posts/placeholder.svg
  slogan:
    enable: true
    text: "YANFD / DIGITAL STUDIO"
  auto_excerpt:
    enable: true
  post_url_target: _self
  post_meta:
    date: true
    category: true
    tag: true

post:
  banner_img: ""
  banner_img_height: 24
  banner_mask_alpha: 0
  default_index_img: ""
  meta:
    author:
      enable: false
    date:
      enable: true
    wordcount:
      enable: true
    min2read:
      enable: true
    views:
      enable: false
  copyright:
    enable: false
  prev_next:
    enable: true
  image_caption:
    enable: true
  image_zoom:
    enable: true
  comments:
    enable: false

archive:
  banner_img: ""
  banner_img_height: 24
  banner_mask_alpha: 0

category:
  banner_img: ""
  banner_img_height: 24
  banner_mask_alpha: 0

tag:
  banner_img: ""
  banner_img_height: 24
  banner_mask_alpha: 0

about:
  banner_img: ""
  banner_img_height: 24
  banner_mask_alpha: 0
  avatar: /img/yanfd-mark.png
  name: "YANFD"
  intro: "Frontend developer / disco jockey / photographer"
  icons:
    - { class: "iconfont icon-github-fill", link: "https://github.com/yanfd", tip: "GitHub" }
    - { class: "iconfont icon-link-fill", link: "https://stats.yanfd.cn/", tip: "Studio" }

page:
  banner_img: ""
  banner_img_height: 24
  banner_mask_alpha: 0

page404:
  banner_img: ""
  banner_img_height: 24
  banner_mask_alpha: 0

footer:
  content: '<span>YANFD / HEXO</span>'
  statistics:
    enable: false
